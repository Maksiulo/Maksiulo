# Деплой Glint на Render в один клик: Dashboard → New → Blueprint → выбрать этот репозиторий.
# Платные планы (~$7 + ~$6 в месяц) нужны для реальных платежей: на бесплатном сервер засыпает,
# и Telegram не дождётся подтверждения оплаты (10 секунд).
services:
  - type: web
    name: glint
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: cd server && npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: glint-db
          property: connectionString
databases:
  - name: glint-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
