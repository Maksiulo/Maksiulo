# Деплой Glint на Render в один клик: Dashboard → New → Blueprint → выбрать этот репозиторий.
# Старт бесплатный: сервер сам пингует себя, чтобы не засыпать.
# Бесплатная база Render живёт ~30 дней — когда пойдут деньги, поменяйте планы на starter / basic-256mb.
services:
  - type: web
    name: glint
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: glint-db
          property: connectionString
databases:
  - name: glint-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
