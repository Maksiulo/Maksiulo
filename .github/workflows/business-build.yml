name: Build product & videos

# Автоматически пересобирает PDF Хук-Банка и 30 видео при изменении текстов.
# Бесплатно: для публичных репозиториев минуты GitHub Actions не ограничены,
# для приватных — 2000 мин/мес на бесплатном аккаунте (сборка занимает ~2 мин).
on:
  push:
    paths:
      - "business/product/hook-bank.md"
      - "business/content/videos.json"
      - "business/tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Build PDFs
        run: python3 business/tools/build_product.py
      - name: Render videos + script doc + schedule
        run: python3 business/tools/render_videos.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add business/product/dist business/content
          git diff --cached --quiet || git commit -m "Auto-build: PDFs and videos"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: videos-and-pdfs
          path: |
            business/content/out
            business/product/dist
